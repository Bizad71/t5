<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>جزوه Help Desk</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #111;
            color: #fff;
        }

        body {
            overflow: hidden;
        }


        /* =========================================
           کل برنامه
           ========================================= */

        .app {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: row;
        }


        /* =========================================
           منوی سرفصل‌ها
           ========================================= */

        .sidebar {
            width: 330px;
            min-width: 330px;
            height: 100vh;
            background: #181818;
            border-left: 1px solid #333;
            overflow-y: auto;
            padding: 15px;
            z-index: 100;
        }

        .sidebar-header {
            position: sticky;
            top: 0;
            background: #181818;
            padding-bottom: 12px;
            z-index: 10;
        }

        .sidebar-title {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            padding: 10px 5px 15px;
        }

        .topic {
            width: 100%;
            border: 1px solid #333;
            background: #222;
            color: #eee;
            padding: 12px;
            margin-bottom: 7px;
            border-radius: 9px;
            cursor: pointer;
            text-align: right;
            font-size: 13px;
            line-height: 1.8;
            transition: 0.2s;
        }

        .topic:hover {
            background: #2d2d2d;
        }

        .topic.active {
            background: #333;
            border-color: #fff;
        }

        .topic-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 28px;
            height: 28px;

            margin-left: 7px;

            background: #111;
            border-radius: 6px;

            font-weight: bold;
            direction: ltr;
        }


        /* =========================================
           بخش اصلی
           ========================================= */

        .content {
            flex: 1;
            min-width: 0;
            height: 100vh;
            background: #eee;
            position: relative;
        }


        /* =========================================
           Header
           ========================================= */

        .viewer-header {
            width: 100%;
            height: 60px;

            background: #202020;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 18px;

            border-bottom: 1px solid #333;
        }

        .viewer-title {
            font-size: 16px;
            font-weight: bold;

            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .viewer-file {
            font-size: 11px;
            color: #999;

            direction: ltr;
            margin-right: 15px;
        }


        /* =========================================
           دکمه منوی موبایل
           ========================================= */

        .menu-button {
            display: none;

            border: 1px solid #444;
            background: #292929;
            color: #fff;

            border-radius: 8px;

            padding: 8px 12px;

            font-family: inherit;
            font-size: 13px;

            cursor: pointer;
        }


        /* =========================================
           Document
           ========================================= */

        .document-area {
            width: 100%;
            height: calc(100vh - 60px);

            background: #fff;

            position: relative;
        }

        #wordViewer {
            width: 100%;
            height: 100%;

            border: 0;

            background: #fff;
        }

        .welcome {
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            color: #555;

            padding: 30px;

            font-size: 17px;
            line-height: 2;
        }


        /* =========================================
           لایه تاریک پشت منوی موبایل
           ========================================= */

        .overlay {
            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.55);

            z-index: 90;
        }


        /* =========================================
           موبایل
           ========================================= */

        @media (max-width: 800px) {

            body {
                overflow: hidden;
            }

            .app {
                display: block;
                width: 100%;
                height: 100vh;
            }


            /* -------------------------------
               Sidebar موبایل
               ------------------------------- */

            .sidebar {
                position: fixed;

                top: 0;
                right: 0;

                width: 88%;
                max-width: 360px;

                height: 100vh;

                transform: translateX(105%);

                transition: transform 0.25s ease;

                border-left: 1px solid #333;

                padding: 12px;

                z-index: 100;
            }

            .sidebar.open {
                transform: translateX(0);
            }


            /* -------------------------------
               عنوان منو
               ------------------------------- */

            .sidebar-title {
                font-size: 18px;
                padding: 8px 5px 14px;
            }


            /* -------------------------------
               دکمه‌ها
               ------------------------------- */

            .topic {
                padding: 11px;

                margin-bottom: 7px;

                font-size: 13px;

                min-height: 48px;
            }


            /* -------------------------------
               Content
               ------------------------------- */

            .content {
                width: 100%;
                height: 100vh;
            }


            /* -------------------------------
               Header موبایل
               ------------------------------- */

            .viewer-header {
                height: 58px;

                padding: 0 10px;

                gap: 8px;
            }

            .viewer-title {
                flex: 1;

                font-size: 13px;

                text-align: right;
            }

            .viewer-file {
                display: none;
            }

            .menu-button {
                display: block;
                flex-shrink: 0;
            }


            /* -------------------------------
               Document
               ------------------------------- */

            .document-area {
                height: calc(100vh - 58px);
            }


            /* -------------------------------
               Overlay
               ------------------------------- */

            .overlay.active {
                display: block;
            }

        }


        /* =========================================
           موبایل خیلی کوچک
           ========================================= */

        @media (max-width: 380px) {

            .sidebar {
                width: 92%;
            }

            .viewer-title {
                font-size: 12px;
            }

            .menu-button {
                padding: 7px 10px;
                font-size: 12px;
            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- =========================================
         منوی سرفصل‌ها
         ========================================= -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">

            <div class="sidebar-title">
                سرفصل‌های Help Desk
            </div>

        </div>

        <div id="topics"></div>

    </aside>


    <!-- =========================================
         لایه پشت منو
         ========================================= -->

    <div class="overlay" id="overlay"></div>


    <!-- =========================================
         محتوای اصلی
         ========================================= -->

    <main class="content">


        <!-- Header -->

        <header class="viewer-header">

            <button
                class="menu-button"
                id="menuButton"
                type="button">

                سرفصل‌ها

            </button>


            <div
                class="viewer-title"
                id="viewerTitle">

                یک سرفصل را انتخاب کنید

            </div>


            <div
                class="viewer-file"
                id="viewerFile">

                -

            </div>

        </header>


        <!-- Document -->

        <section class="document-area">


            <div
                class="welcome"
                id="welcome">

                برای شروع، از دکمه «سرفصل‌ها»
                یکی از مباحث را انتخاب کنید.

            </div>


            <iframe
                id="wordViewer"
                style="display:none;"
                allowfullscreen>
            </iframe>


        </section>

    </main>

</div>


<script>


    /* =========================================
       سرفصل‌ها
       ========================================= */

    const topics = [

        "دستگاه‌های موبایل (Mobile Devices)",
        "شبکه (Networking)",
        "سخت‌افزار (Hardware)",
        "مجازی‌سازی و رایانش ابری (Virtualization and Cloud Computing)",
        "عیب‌یابی سخت‌افزار و شبکه (Hardware and Network Troubleshooting)",
        "سیستم‌عامل‌ها (Operating Systems)",
        "امنیت (Security)",
        "عیب‌یابی نرم‌افزار (Software Troubleshooting)",
        "رویه‌های عملیاتی (Operational Procedures)",

        "مفاهیم شبکه (Network Concepts)",
        "توپولوژی شبکه (Network Topology)",
        "سخت‌افزار شبکه (Network Hardware)",
        "مدل OSI",
        "TCP/IP",
        "دستورات و ابزارهای شبکه (Network Commands and Tools)",
        "مفاهیم Firewall",

        "مقدمه مجازی‌سازی در VMware Workstation",
        "نسخه‌های Windows",
        "نصب، ارتقا و مهاجرت Windows",
        "User Profiles",
        "Users and Groups",
        "UAC",
        "Windows Firewall",
        "Registry و Group Policy (مقدماتی)",
        "User Rights Assignment و Permission",
        "Share Permission",
        "Device Management",
        "Devices and Printers؛ نصب و عیب‌یابی",
        "Image و Backup ویندوز",
        "Event Viewer",
        "Advanced Boot Options",
        "Encrypting File System (EFS)",
        "BitLocker",
        "Certificate Manager",
        "Task Scheduler",
        "Disk Management",
        "مفاهیم ADSL Modem",
        "عیب‌یابی مشکلات Windows",

        "مفاهیم Domain و Workgroup",
        "Active Directory Users and Computers (DSA مقدماتی)",
        "Group Policy Management Console (GPMC)",
        "DHCP (مقدماتی)",
        "DNS (مقدماتی)",

        "نصب Windows از طریق شبکه؛ مبانی، معماری و پیش‌نیازها",
        "نصب، پیکربندی اولیه و مدیریت Imageها",
        "شخصی‌سازی، درایورها و Automation",

        "مدیریت دسترسی و تفاوت Permissionها",
        "FSRM",
        "DFS",
        "Shadow Copies (VSS)",
        "Access-Based Enumeration (ABE)",
        "File Screening Management"

    ];


    /* =========================================
       عناصر
       ========================================= */

    const topicsContainer =
        document.getElementById("topics");

    const sidebar =
        document.getElementById("sidebar");

    const overlay =
        document.getElementById("overlay");

    const menuButton =
        document.getElementById("menuButton");

    const viewer =
        document.getElementById("wordViewer");

    const welcome =
        document.getElementById("welcome");

    const viewerTitle =
        document.getElementById("viewerTitle");

    const viewerFile =
        document.getElementById("viewerFile");


    /* =========================================
       ساخت منوی سرفصل‌ها
       ========================================= */

    topics.forEach((topic, index) => {

        const number = index + 1;

        const button =
            document.createElement("button");

        button.className = "topic";

        button.type = "button";

        button.innerHTML = `
            <span class="topic-number">
                ${number}
            </span>
            ${topic}
        `;


        button.addEventListener(
            "click",
            function () {

                openDocument(
                    number,
                    topic,
                    button
                );

            }
        );


        topicsContainer.appendChild(button);

    });


    /* =========================================
       باز کردن سند
       ========================================= */

    function openDocument(
        number,
        topic,
        button
    ) {


        /*
        نام فایل:

        word1.docx
        word2.docx
        ...
        word52.docx
        */

        const fileName =
            "word" + number + ".docx";


        /*
        ساخت آدرس فایل
        */

        const baseURL =
            window.location.origin +
            window.location.pathname.substring(
                0,
                window.location.pathname.lastIndexOf("/") + 1
            );


        const fileURL =
            baseURL + fileName;


        /*
        Microsoft Office Viewer
        */

        const officeViewerURL =
            "https://view.officeapps.live.com/op/embed.aspx?src=" +
            encodeURIComponent(fileURL);


        /*
        عنوان
        */

        viewerTitle.textContent =
            number + ". " + topic;


        viewerFile.textContent =
            fileName;


        /*
        نمایش فایل
        */

        viewer.src =
            officeViewerURL;


        viewer.style.display =
            "block";


        welcome.style.display =
            "none";


        /*
        فعال کردن سرفصل
        */

        document
            .querySelectorAll(".topic")
            .forEach(item => {

                item.classList.remove("active");

            });


        button.classList.add("active");


        /*
        بستن منوی موبایل
        */

        closeMenu();

    }


    /* =========================================
       باز کردن منو
       ========================================= */

    menuButton.addEventListener(
        "click",
        function () {

            sidebar.classList.add("open");

            overlay.classList.add("active");

        }
    );


    /* =========================================
       بستن منو
       ========================================= */

    function closeMenu() {

        sidebar.classList.remove("open");

        overlay.classList.remove("active");

    }


    overlay.addEventListener(
        "click",
        closeMenu
    );


    /*
    جلوگیری از بسته شدن اشتباهی منو
    هنگام کلیک داخل Sidebar
    */

    sidebar.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

        }
    );


</script>

</body>

</html>
